# Shelly Plus 1PM shellies/warmwasser
- switch:
    unique_id: warmwasser_zirkulation_switch
    name: "Warmwasser Zirkulation"
    state_topic: shellies/warmwasser/status/switch/0
    state_on: "on"
    state_off: "off"
    command_topic: shellies/warmwasser/command/switch/0
    payload_on: "on,1200" # turn off after 1200 seconds
    payload_off: "off"
    device:
      name: "Warmwasser Zirkulation"
      identifiers:
        - warmwasser_zirkulation
      manufacturer: Shelly
      model: Plus 1PM

# Shelly 1PM shellies/shelly-og-jara-1pm (Power, Voltage, Current in 1 phase)
- switch:
    unique_id: og_jara_wand_switch
    name: "OG Jara Wand"
    state_topic: shellies/shelly-og-jara-1pm/relay/0
    state_on: "on"
    state_off: "off"
    command_topic: shellies/shelly-og-jara-1pm/relay/0/command
    payload_on: "on"
    payload_off: "off"
    optimistic: true
    qos: 0
    retain: true
    # Map to same device as the switch identified by og_jara_wand_switch
    device:
      name: "OG Jara Wand"
      identifiers:
        - og_jara_wand_switch
      manufacturer: Shelly
      model: 1PM
      suggested_area: "Jara"
- sensor:
    unique_id: og_jara_wand_power
    name: "OG Jara Wand Power"
    state_topic: shellies/shelly-og-jara-1pm/emeter/0/power
    device_class: power
    unit_of_measurement: W
    state_class: measurement
    # Map to same device as the switch identified by og_jara_wand_switch
    device:
      name: "OG Jara Wand"
      identifiers:
        - og_jara_wand_switch

