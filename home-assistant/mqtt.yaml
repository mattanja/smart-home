# Shelly Gen 1
# https://shelly-api-docs.shelly.cloud/gen1/#shelly1-1pm-mqtt
# shellies/Garten-1PM/relay/0/command on
# shellies/Garten-1PM/relay/0/command off
# Devices:
# shellies/Garten-1PM
# shellies/EG-Power
# shellies/OG-Power
# shellies/PV-Mini
# PV-Mini OG-Photovoltaik
# shellies/OG-TV-1PM
# shellies/OG-Office-1PM (Jara Wand)
# shellies/House-Power (3EM)


# Shelly Gen 2
# https://shelly-api-docs.shelly.cloud/gen2/ComponentsAndServices/Mqtt/#mqtt-control
# Devices:
# shellies/shelly-steckdose-01
# shellies/shelly-steckdose-02

# Shelly 1PM shellies/Garten-1PM/ (Power, Voltage, Current in 1 phase)
- switch:
    unique_id: garten_pv_switch
    name: "Garten und PV"
    state_topic: shellies/Garten-1PM/relay/0
    state_on: "on"
    state_off: "off"
    command_topic: shellies/Garten-1PM/relay/0/command
    payload_on: "on"
    payload_off: "off"
    optimistic: true
    qos: 0
    retain: true
    device:
      name: "Garten und PV"
      identifiers:
        - garten_pv_switch
      manufacturer: Shelly
      model: 1PM
      suggested_area: "Garden"
- sensor:
    unique_id: garten_pv_power
    name: "Garten und PV Power"
    state_topic: shellies/Garten-1PM/emeter/0/power
    device_class: power
    unit_of_measurement: W
    state_class: measurement
    device:
      name: "Garten und PV"
      identifiers:
        - garten_pv_switch


# Shelly 1PM shellies/OG-TV-1PM/ (Power, Voltage, Current in 1 phase)
- switch:
    unique_id: og_tv_switch
    name: "OG TV Schalter"
    state_topic: shellies/OG-TV-1PM/relay/0
    state_on: "on"
    state_off: "off"
    command_topic: shellies/OG-TV-1PM/relay/0/command
    payload_on: "on"
    payload_off: "off"
    optimistic: true
    qos: 0
    retain: true
    device:
      name: "OG TV"
      identifiers:
        - og_tv_switch
      manufacturer: Shelly
      model: 1PM
      suggested_area: "Living Room"
- sensor:
    unique_id: og_tv_power
    name: "OG TV Power"
    state_topic: shellies/OG-TV-1PM/emeter/0/power
- sensor:
    unique_id: og_tv_external_temperature
    name: "OG TV External Temperature"
    state_topic: shellies/OG-TV-1PM/ext_temperature/0
    device_class: temperature
    unit_of_measurement: °C
    state_class: measurement
    device:
      name: "OG TV Temperature"
      identifiers:
        - og_tv_temperature


