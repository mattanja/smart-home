- id: smart_ev_charging
  alias: Smart EV Charging
  triggers:
  - trigger: time
    at: sensor.tibber_best_price_start
  conditions:
  - condition: numeric_state
    entity_id: sensor.tibber_current_interval_price_rating
    below: -15
  actions:
  - target:
      entity_id: switch.ev_charger
    action: switch.turn_on
- id: '1764827050815'
  alias: Wallbox laden wenn günstig
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.tibber_best_price_period
    to:
    - 'on'
  conditions: []
  actions:
  - action: easee.action_command
    metadata: {}
    data:
      device_id: cf0d7e56b5d239172d13caec0b1afc1f
      action_command: override_schedule
  - action: easee.action_command
    metadata: {}
    data:
      action_command: start
      device_id: cf0d7e56b5d239172d13caec0b1afc1f
  - variables:
      wallbox_title: Wallbox rechts gestartet
      wallbox_message: >-
        Ladevorgang gestartet: {{ states('sensor.tibber_hourly_price_current') }}
        ct/kWh

        Niedrigster Preis heute: {{ states('sensor.tibber_today_s_lowest_price') }}
        ct/kWh

        Niedrigster Preis morgen: {{ states('sensor.tibber_tomorrow_s_lowest_price')
        }} ct/kWh

        Trend (2h): {{ states('sensor.tibber_price_trend_2h') }}

        Volatility: {{ states('sensor.tibber_today_s_price_volatility') }}
  - parallel:
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.mattanjas_iphone
      data:
        title: '{{ wallbox_title }}'
        message: '{{ wallbox_message }}'
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.mattanjas_pixel
      data:
        title: '{{ wallbox_title }}'
        message: '{{ wallbox_message }}'
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.iphone_von_claudia
      data:
        title: '{{ wallbox_title }}'
        message: '{{ wallbox_message }}'
  mode: single
