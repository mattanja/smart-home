- id: christmas_lighting_schedule
  alias: Weihnachtsbeleuchtung Zeitplan
  description: Automatische Steuerung der Weihnachtsbeleuchtung nach Zeitplan
  triggers:
  - at: 06:00:00
    id: turn_on_morning
    trigger: time
  - at: 08:00:00
    id: turn_off_morning
    trigger: time
  - at: '16:00:00'
    id: turn_on_evening
    trigger: time
  - at: '22:30:00'
    id: turn_off_evening
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: turn_on_morning
      sequence:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.weihnachtsbeleuchtung_an
    - conditions:
      - condition: trigger
        id: turn_off_morning
      sequence:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.weihnachtsbeleuchtung_aus
    - conditions:
      - condition: trigger
        id: turn_on_evening
      sequence:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.weihnachtsbeleuchtung_an
    - conditions:
      - condition: trigger
        id: turn_off_evening
      sequence:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.weihnachtsbeleuchtung_aus
  mode: single
- id: blinds_morning_tilt
  alias: Jalousien morgens kippen
  description: Kippt die Jalousien um 06:15 für Morgenlicht
  triggers:
  - at: 06:15:00
    trigger: time
  conditions: []
  actions:
  - action: cover.set_cover_tilt_position
    target:
      area_id: wohnzimmer
    data:
      tilt_position: 50
  mode: single
