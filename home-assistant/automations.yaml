- id: tv_power_notifications
  alias: Fernseher an/aus Benachrichtigung
  description: 'Migriert von ioBroker script.js.common.Home (Telegram). Leistung mit
    Hysterese: an > 40 W, aus < 15 W, jeweils 1 Min stabil (kurze Dips beim Bildinhalt
    sollen keine Falsch-Meldungen auslösen).'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.og_tv_power
    above: 40
    for:
      minutes: 1
    id: turned_on
  - trigger: numeric_state
    entity_id: sensor.og_tv_power
    below: 15
    for:
      minutes: 1
    id: turned_off
  conditions: []
  actions:
  - variables:
      notify_title: Fernseher
      notify_message: '{% if trigger.id == "turned_on" %}Fernseher eingeschaltet!{%
        else %}Fernseher ausgeschaltet.{% endif %}'
  - parallel:
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.mattanjas_iphone
      data:
        title: '{{ notify_title }}'
        message: '{{ notify_message }}'
    - action: notify.send_message
      continue_on_error: true
      target:
        entity_id: notify.iphone_von_claudia
      data:
        title: '{{ notify_title }}'
        message: '{{ notify_message }}'
  mode: single
- id: '1792682704254'
  alias: Eltern Dunstabzug bei Balkontür
  description: Spiegelt den Balkontür-Kontakt auf die Steckdose EG Dunstabzugshaube.
    Nutzt den aktuellen Sensorzustand (nicht den Trigger), mit 2s Entprellung und
    Retry bei Zigbee-Timeout.
  triggers:
  - platform: state
    entity_id: binary_sensor.fenster
    to:
    - 'on'
    - 'off'
    for:
      seconds: 2
  conditions:
  - condition: template
    value_template: '{{ states(''binary_sensor.fenster'') in [''on'', ''off''] }}'
  actions:
  - repeat:
      count: 3
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.fenster
          state: 'on'
        then:
        - action: switch.turn_on
          continue_on_error: true
          target:
            entity_id: switch.steckdose_licht_wohnzimmer_switch
        else:
        - action: switch.turn_off
          continue_on_error: true
          target:
            entity_id: switch.steckdose_licht_wohnzimmer_switch
      - delay:
          seconds: 2
      - if:
        - condition: template
          value_template: '{{ (is_state(''binary_sensor.fenster'', ''on'') and is_state(''switch.steckdose_licht_wohnzimmer_switch'',
            ''on'')) or (is_state(''binary_sensor.fenster'', ''off'') and is_state(''switch.steckdose_licht_wohnzimmer_switch'',
            ''off'')) }}'
        then:
        - stop: Steckdose entspricht Tür
  mode: restart
- id: '1794293339858'
  alias: Warmwasser Zirkulation Auto-Aus 30 Min
  description: 'Außerhalb der Zeitfenster (05:45–08:00, 19:30–22:00): nach manuellem
    Einschalten über das Dashboard nach 30 Minuten wieder ausschalten.'
  triggers:
  - platform: state
    entity_id: switch.warmwasser_zirkulation_warmwasser_zirkulation
    to: 'on'
    for:
      minutes: 30
  conditions:
  - condition: template
    value_template: '{% set mins = now().hour * 60 + now().minute %}{{ not ((5*60+45
      <= mins < 8*60) or (19*60+30 <= mins < 22*60)) }}'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.warmwasser_zirkulation_warmwasser_zirkulation
  mode: single
- id: '1794293351039'
  alias: Warmwasser Zirkulation Zeitplan
  description: Umwälzpumpe an 05:45-08:00 und 19:30-22:00. Ohne Shelly-toggle_after,
    damit sie im Fenster dauerhaft laeuft. Bei HA-Start im Fenster nachziehen.
  triggers:
  - id: morning_on
    platform: time
    at: 05:45:00
  - id: morning_off
    platform: time
    at: 08:00:00
  - id: evening_on
    platform: time
    at: '19:30:00'
  - id: evening_off
    platform: time
    at: '22:00:00'
  - id: ha_start
    platform: homeassistant
    event: start
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - morning_on
        - evening_on
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.warmwasser_zirkulation_warmwasser_zirkulation
    - conditions:
      - condition: trigger
        id:
        - morning_off
        - evening_off
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.warmwasser_zirkulation_warmwasser_zirkulation
    - conditions:
      - condition: trigger
        id: ha_start
      - condition: template
        value_template: '{% set mins = now().hour * 60 + now().minute %}{{ (5*60+45
          <= mins < 8*60) or (19*60+30 <= mins < 22*60) }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.warmwasser_zirkulation_warmwasser_zirkulation
  mode: queued
  max: 5

- id: "1700759472567"
  alias: Weihnachtsbeleuchtung Zeitplan
  description: Steckdose 01/02 via Szenen. An 16:30, aus 23:00, morgens aus 08:00 (Alt 11:00). Außerhalb Saison Automation deaktivieren.
  mode: single
  triggers:
    - trigger: time
      at: "16:30:00"
      id: evening_on
    - trigger: time
      at: "23:00:00"
      id: night_off
    - trigger: time
      at: "08:00:00"
      id: morning_off
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: evening_on
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.weihnachtsbeleuchtung_an
        - conditions:
            - condition: trigger
              id:
                - night_off
                - morning_off
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.weihnachtsbeleuchtung_aus
