title: Home
views:
  - path: default_view
    title: Home
    cards:
      - type: vertical-stack
        cards:
          - show_name: true
            show_icon: true
            type: button
            tap_action:
              action: toggle
            entity: switch.og_tv_switch
            icon: mdi:television
            name: Fernseher
            show_state: true
            icon_height: 60px
          - type: light
            entity: light.josh_led_lampe_light
          - type: light
            entity: light.jara_leds_light
        title: Start
      - type: vertical-stack
        title: Temperatur / Info
        cards:
          - type: sensor
            entity: sensor.og_tv_external_temperature
            graph: line
      - type: vertical-stack
        title: Energie
        cards:
          - type: history-graph
            entities:
              - sensor.house_total_power
            hours_to_show: 3
          - type: entities
            title: Haus (Gesamt)
            entities:
              - sensor.house_power_phase0_power
              - sensor.house_power_phase1_power
              - sensor.house_power_phase2_power
          - type: entities
            title: OG (Familie)
            entities:
              - sensor.og_power_meter_og_power_phase_0_power
              - sensor.og_power_meter_og_power_phase_1_power
              - sensor.og_power_meter_og_power_phase_2_power
          - type: entities
            title: EG (Eltern)
            entities:
              - sensor.eg_power_phase0_power
              - sensor.eg_power_phase1_power
              - sensor.eg_power_phase2_power
    badges: []
  - type: sections
    path: rolladen
    max_columns: 4
    title: Rolläden
    sections:
      - type: grid
        cards:
          - type: heading
            heading: New section
          - type: tile
            entity: cover.dg_bad_links
          - type: tile
            entity: cover.dg_bad_rechts
          - type: tile
            entity: cover.dg_jara
          - type: tile
            entity: cover.dg_schlafen_links
          - type: tile
            entity: cover.dg_schlafen_rechts
