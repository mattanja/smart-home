title: Zuhause
views:
  # ── Home ──────────────────────────────────────────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 3
    dense_section_placement: true
    badges:
      - type: entity
        entity: weather.home
        show_name: false
      - type: entity
        entity: person.mattanja_kern
        show_name: false
      - type: entity
        entity: person.claudia_kern
        show_name: false
      - type: entity
        entity: person.joshua
        show_name: false
      - type: entity
        entity: sensor.house_total_power
        show_name: false
        color: amber
      - type: entity
        entity: sensor.tibber_current_electricity_price
        name: Tibber
        show_name: true
        color: green
    sections:
      # Camera
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Eingang
            heading_style: title
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.192_168_57_55
            name: Eingang
            show_state: false
            show_name: false
            camera_view: live
            grid_options:
              columns: 12
              rows: 4

      # Quick actions
      - type: grid
        cards:
          - type: heading
            heading: Schnellzugriff
            heading_style: title
            icon: mdi:flash
          - type: tile
            entity: switch.og_tv_switch
            name: Fernseher
            icon: mdi:television
            vertical: true
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: switch.warmwasser_zirkulation_warmwasser_zirkulation
            name: Dusche warm
            icon: mdi:shower-head
            vertical: true
            color: deep-orange
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: binary_sensor.fenster_zustand
            name: Fenster
            icon: mdi:window-open-variant
            color: cyan
            grid_options:
              columns: 12
          - type: tile
            entity: scene.weihnachtsbeleuchtung_an
            name: Weihnachten an
            icon: mdi:pine-tree
            color: green
            hide_state: true
            grid_options:
              columns: 6
          - type: tile
            entity: scene.weihnachtsbeleuchtung_aus
            name: Weihnachten aus
            icon: mdi:pine-tree-variant-outline
            hide_state: true
            grid_options:
              columns: 6

      # Lights – Jara
      - type: grid
        cards:
          - type: heading
            heading: Jara
            heading_style: title
            icon: mdi:face-woman-outline
            badges:
              - type: entity
                entity: light.jara_leds_light
                show_name: false
          - type: tile
            entity: light.jara_leds_light
            name: LEDs
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: light.jara_decke_light
            name: Decke
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: switch.og_jara_wand_og_jara_wand
            name: Nachtlicht
            icon: mdi:lamp-outline
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: scene.jara_room_white
            name: Weiß
            hide_state: true
            color: grey
            grid_options:
              columns: 4
          - type: tile
            entity: scene.jara_room_blue
            name: Blau
            hide_state: true
            color: blue
            grid_options:
              columns: 4
          - type: tile
            entity: scene.jara_red
            name: Rot
            hide_state: true
            color: red
            grid_options:
              columns: 4
          - type: tile
            entity: cover.dg_jara
            name: Rolladen
            features_position: bottom
            features:
              - type: cover-open-close
            grid_options:
              columns: 12

      # Lights – Josh
      - type: grid
        cards:
          - type: heading
            heading: Josh
            heading_style: title
            icon: mdi:account-cowboy-hat
            badges:
              - type: entity
                entity: light.josh_led_lampe_light
                show_name: false
          - type: tile
            entity: light.josh_led_lampe_light
            name: LED Lampe
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: cover.og_josh
            name: Rolladen
            features_position: bottom
            features:
              - type: cover-open-close
            grid_options:
              columns: 12

      # Climate
      - type: grid
        cards:
          - type: heading
            heading: Klima
            heading_style: title
            icon: mdi:thermostat
          - type: tile
            entity: sensor.og_tv_external_temperature
            name: OG Wohnzimmer
            icon: mdi:thermometer
            features:
              - type: trend-graph
                hours_to_show: 24
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: sensor.sonoff_snzb_02d_temperature_2
            name: EG Wohnzimmer
            icon: mdi:thermometer
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sonoff_snzb_02d_humidity_2
            name: EG Feuchte
            icon: mdi:water-percent
            grid_options:
              columns: 6
          - type: tile
            entity: climate.ac_wohnzimmer
            name: AC Wohnzimmer
            features_position: bottom
            features:
              - type: target-temperature
              - type: climate-hvac-modes
                style: icons
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - dry
                  - fan_only
            grid_options:
              columns: 12
              rows: 3
          - type: tile
            entity: climate.ac_schlafzimmer
            name: AC Schlafzimmer
            features_position: bottom
            features:
              - type: target-temperature
              - type: climate-hvac-modes
                style: icons
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - dry
                  - fan_only
            grid_options:
              columns: 12
              rows: 3

      # Covers living room (replaces broken jalousie automations)
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Rolläden OG Wohnzimmer
            heading_style: title
            icon: mdi:blinds-horizontal
            badges:
              - type: entity
                entity: cover.og_wohnzimmer_1
                show_name: false
          - type: tile
            entity: cover.og_wohnzimmer_1
            name: Links außen
            features_position: bottom
            features:
              - type: cover-open-close
              - type: cover-position
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: cover.og_wohnzimmer_2
            name: Links innen
            features_position: bottom
            features:
              - type: cover-open-close
              - type: cover-position
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: cover.og_wohnzimmer_3
            name: Rechts innen
            features_position: bottom
            features:
              - type: cover-open-close
              - type: cover-position
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: cover.og_wohnzimmer_4
            name: Rechts außen
            features_position: bottom
            features:
              - type: cover-open-close
              - type: cover-position
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: scene.og_wohnzimmer_jalousien_mittig
            name: Alle mittig
            icon: mdi:blinds-horizontal
            hide_state: true
            grid_options:
              columns: 6
          - type: tile
            name: Alle Rolläden
            icon: mdi:arrow-right-bold
            entity: cover.og_wohnzimmer_1
            hide_state: true
            tap_action:
              action: navigate
              navigation_path: /home-yaml/rolladen
            grid_options:
              columns: 6

      # Energy – private house + PV
      - type: grid
