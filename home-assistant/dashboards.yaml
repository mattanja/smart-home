          - type: heading
            heading: Haus & PV (privat)
            heading_style: title
            icon: mdi:home-lightning-bolt
          - type: tile
            entity: sensor.house_total_power
            name: Hausleistung
            icon: mdi:flash
            color: amber
            features:
              - type: trend-graph
                hours_to_show: 6
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: sensor.hoymiles_station_garten_current_power
            name: Hoymiles Garten
            icon: mdi:solar-power-variant
            color: yellow
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.hoymiles_station_garten_daily_energy
            name: Heute Garten
            icon: mdi:solar-power
            color: yellow
            grid_options:
              columns: 6
          - type: tile
