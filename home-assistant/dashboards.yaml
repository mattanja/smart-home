            icon: mdi:solar-panel
            color: yellow
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.og_power_meter_og_power_phase_0_power
            name: OG L1
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.og_power_meter_og_power_phase_1_power
            name: OG L2
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.og_power_meter_og_power_phase_2_power
            name: OG L3
            grid_options:
              columns: 4

      # Energy – company wallboxes / Tibber
      - type: grid
