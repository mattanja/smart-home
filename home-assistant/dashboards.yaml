          - type: heading
            heading: Wallbox (Firma / Tibber)
            heading_style: title
            icon: mdi:ev-station
          - type: tile
            entity: sensor.tibber_current_electricity_price
            name: Tibber jetzt
            icon: mdi:currency-eur
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.tibber_current_price_level
            name: Preisniveau
            icon: mdi:speedometer
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.tibber_next_electricity_price
            name: Nächste Stunde
            icon: mdi:clock-outline
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.wallbox_links_status
            name: Links
            icon: mdi:ev-plug-type2
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.wallbox_rechts_status
            name: Rechts
            icon: mdi:ev-plug-type2
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.wallbox_links_power
            name: Links W
            icon: mdi:lightning-bolt
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.wallbox_rechts_power
