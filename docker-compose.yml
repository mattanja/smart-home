###
# Full installation of Home-Automation with the following components:
# - Home-Assistant (https://www.home-assistant.io/) to view and control all devices
# - ioBroker (https://www.iobroker.net/) — Fiat/Telegram until migrated; safe to keep
# - Mosquitto (https://mosquitto.org/) as MQTT broker
# - Node-Red (via ioBroker) for legacy flows
#
# Removed 2026-11-10: InfluxDB + Telegraf + Grafana (unused dashboards; HA utility meters
# cover month/year energy). Data dirs ./influxdb ./grafana ./telegraf kept on disk until
# manually deleted. Historical kWh: Obsidian «Stromverbrauch Monat Jahr».

networks:
  default:

services:
  mosquitto:
    # Pin versions for reproducible updates (was :latest)
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TIMEZONE}

  # Cedalo Management Center removed 2026-11-10: unused (:dev), no license key, only log spam.
  # Mosquitto itself stays. Re-add a pinned cedalo/management-center:2.6.4 if needed later.

  homeassistant:
    # Prefer explicit version over :stable for rollback (record old image id before upgrades)
    # Rollback: previous image id sha256:e5ee66f11f90… (tag 2026.10.0), recorded 2026-11-10
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    container_name: homeassistant
    restart: always
    privileged: true
    ports:
      - "5683:5683"
      - "8123:8123"
    volumes:
      - ./home-assistant:/config
    environment:
      - TZ=Europe/Berlin

  iobroker:
    # Pinned 2026-11-10 to the digest that was running as :latest (js-controller/ioBroker 6.0.9).
    # Prefer digest over :latest so QNAP recreates do not silently float.
    image: iobroker/iobroker@sha256:0a48074cd9dbef6cab285d5b9f39d7af52c28731c37972b74287abecce593fc1
    container_name: iobroker
    restart: always
    hostname: iobroker
    environment:
      # Set port of webinterface to 8091 (default is 8081 but this is already used by the QNAP Container Station)
      - IOB_ADMINPORT=8091
    ports:
      - "8091:8091"
      - "1880:1880"
    volumes:
      - ./iobroker:/opt/iobroker
